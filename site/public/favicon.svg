<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>Lumagrid favicon</title>
  <!-- Dedicated 16 px design, not a shrunken mark. Assumption (research A1): strokes in
       multiples of 4 units (1 px at 16 px); the rising line is 8 units (2 px). Plan 05-06
       adjusts after viewing the 16 px render. Lattice lines are decorative and may soften. -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#05070A"/>
  <g stroke="#00E5FF" stroke-width="4" opacity="0.5" fill="none">
    <line x1="8" y1="32" x2="56" y2="32"/>
    <line x1="32" y1="8" x2="32" y2="56"/>
  </g>
  <polyline points="8,56 32,32 56,8" fill="none" stroke="#7DF9FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="12" fill="#00E5FF"/>
</svg>
