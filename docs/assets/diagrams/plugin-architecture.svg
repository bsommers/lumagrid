<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="plugin-title plugin-desc">
  <title id="plugin-title">Lumagrid plugin architecture</title>
  <desc id="plugin-desc">WidgetContainer passes data to ViewSwitcher by render prop. ViewSwitcher calls getPlugin with a view id on the plugin registry. The registry holds ChartPlugin objects with an id, an optional label, a dataAdapter, a themeAdapter and a Renderer. Four plugin sources feed the registry through registerPlugin: createNativePlugin for the seven native charts, createD3Plugin, createRechartsPlugin and createNivoPlugin.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7DF9FF"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF2BD6"/>
    </marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" fill="#05070A"/>

  <g font-family="'Inter', Arial, sans-serif" text-anchor="middle">
    <!-- Left: container layer -->
    <g>
      <rect x="40" y="96" width="168" height="72" rx="16" fill="#0B0F14"/>
      <rect x="40" y="96" width="168" height="72" rx="16" fill="url(#glow)"/>
      <rect x="40" y="96" width="168" height="72" rx="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="124" y="124" font-size="14" font-weight="700" fill="#E6EDF3">WidgetContainer</text>
      <text x="124" y="144" font-size="12" fill="#9AA4B2">pipeline, size, title</text>
    </g>
    <g>
      <rect x="40" y="216" width="168" height="72" rx="16" fill="#0B0F14"/>
      <rect x="40" y="216" width="168" height="72" rx="16" fill="url(#glow)"/>
      <rect x="40" y="216" width="168" height="72" rx="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="124" y="244" font-size="14" font-weight="700" fill="#E6EDF3">ViewSwitcher</text>
      <text x="124" y="264" font-size="12" fill="#9AA4B2">tab strip, picks a view</text>
    </g>

    <!-- Center: registry holding the ChartPlugin contract -->
    <g>
      <rect x="272" y="48" width="416" height="264" rx="16" fill="#0B0F14"/>
      <rect x="272" y="48" width="416" height="264" rx="16" fill="url(#glow)"/>
      <rect x="272" y="48" width="416" height="264" rx="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="480" y="80" font-size="16" font-weight="700" fill="#E6EDF3">Plugin registry</text>
      <text x="480" y="100" font-size="12" fill="#9AA4B2">one module-level Map of ChartPlugin</text>
      <rect x="304" y="120" width="352" height="168" rx="12" fill="#05070A" stroke="#7DF9FF" stroke-width="2"/>
      <text x="480" y="148" font-size="14" font-weight="700" fill="#7DF9FF">ChartPlugin</text>
      <g font-size="12" fill="#C9D1D9" text-anchor="start">
        <text x="328" y="176">id: string</text>
        <text x="328" y="198">label?: string</text>
        <text x="328" y="220">dataAdapter(data, config) : TData</text>
        <text x="328" y="242">themeAdapter(theme, config) : TTheme</text>
        <text x="328" y="264">Renderer: ComponentType of RendererProps</text>
      </g>
    </g>

    <!-- Right: plugin sources -->
    <g>
      <rect x="752" y="48" width="168" height="56" rx="16" fill="#0B0F14"/>
      <rect x="752" y="48" width="168" height="56" rx="16" fill="url(#glow)"/>
      <rect x="752" y="48" width="168" height="56" rx="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="836" y="76" font-size="14" font-weight="700" fill="#E6EDF3">createNativePlugin</text>
      <text x="836" y="96" font-size="12" fill="#9AA4B2">seven native charts</text>
    </g>
    <g>
      <rect x="752" y="120" width="168" height="56" rx="16" fill="#0B0F14"/>
      <rect x="752" y="120" width="168" height="56" rx="16" fill="url(#glow)"/>
      <rect x="752" y="120" width="168" height="56" rx="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="836" y="148" font-size="14" font-weight="700" fill="#E6EDF3">createD3Plugin</text>
      <text x="836" y="168" font-size="12" fill="#9AA4B2">D3 adapter</text>
    </g>
    <g>
      <rect x="752" y="192" width="168" height="56" rx="16" fill="#0B0F14"/>
      <rect x="752" y="192" width="168" height="56" rx="16" fill="url(#glow)"/>
      <rect x="752" y="192" width="168" height="56" rx="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="836" y="220" font-size="14" font-weight="700" fill="#E6EDF3">createRechartsPlugin</text>
      <text x="836" y="240" font-size="12" fill="#9AA4B2">Recharts adapter</text>
    </g>
    <g>
      <rect x="752" y="264" width="168" height="56" rx="16" fill="#0B0F14"/>
      <rect x="752" y="264" width="168" height="56" rx="16" fill="url(#glow)"/>
      <rect x="752" y="264" width="168" height="56" rx="16" fill="none" stroke="#00E5FF" stroke-width="2"/>
      <text x="836" y="292" font-size="14" font-weight="700" fill="#E6EDF3">createNivoPlugin</text>
      <text x="836" y="312" font-size="12" fill="#9AA4B2">Nivo adapter</text>
    </g>
  </g>

  <!-- Arrows -->
  <line x1="124" y1="168" x2="124" y2="212" stroke="#7DF9FF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="208" y1="252" x2="268" y2="252" stroke="#FF2BD6" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <g stroke="#7DF9FF" stroke-width="2" fill="none">
    <line x1="748" y1="76" x2="692" y2="76" marker-end="url(#arrow)"/>
    <line x1="748" y1="148" x2="692" y2="148" marker-end="url(#arrow)"/>
    <line x1="748" y1="220" x2="692" y2="220" marker-end="url(#arrow)"/>
    <line x1="748" y1="292" x2="692" y2="292" marker-end="url(#arrow)"/>
  </g>
  <g font-family="'Inter', Arial, sans-serif" font-size="12" fill="#C9D1D9">
    <text x="132" y="196">render prop</text>
    <text x="214" y="240" font-size="11">getPlugin</text>
    <text x="480" y="344" text-anchor="middle">Sources call registerPlugin(plugin). ViewSwitcher looks a plugin up with getPlugin(id).</text>
  </g>
</svg>
