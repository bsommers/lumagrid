name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs the full suite with coverage. No threshold is configured (see
      # vitest.config.ts) — this reports the number in CI logs, it does not
      # gate the build. Revisit once the P0/P1/P2 coverage gaps are closed.
      - run: npm run test:coverage
      - run: npm run build
