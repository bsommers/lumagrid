# Hosted CI is a backstop only. The primary gate is local: scripts/ci.sh, run by
# the .githooks/pre-push hook. This workflow is currently disabled in GitHub
# (Actions > CI) to save minutes; it is kept minimal for when it is re-enabled.
#
# Minute-saving choices: no push trigger (main is gated locally before push),
# PRs only for code changes, drafts skipped, one Linux job, npm cache,
# superseded runs cancelled, hard 10-minute cap.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**', '.planning/**', 'plans/**', '.ontology/**', '.security-reports/**', 'LICENSE', 'NOTICE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: scripts/ci.sh
