name: CI

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
    branches: [main]
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs the full suite with coverage. No threshold is configured (see
      # vitest.config.ts) — this reports the number in CI logs, it does not
      # gate the build. Revisit once the P0/P1/P2 coverage gaps are closed.
      - run: npm run test:coverage
      - run: npm run build
